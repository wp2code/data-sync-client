name: Release

# 推送 v* 格式的 Tag 时自动构建并发布新版本到 GitHub Releases
# 仅 main（或 master）分支上的 Tag 生效
on:
  push:
    tags:
      - 'v*'

# 防止同一 tag 多次并发执行（如 force-push 同一 tag）
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest
    # 显式超时：30 分钟包含 clean build + 上传；超出立即 fail
    timeout-minutes: 30

    steps:
      # ── 1. 拉取完整历史（含 tags） ─────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # ── 2. 校验 tag 必须位于主分支历史中 ────────────────────
      # 兼容 main 或 master（不同仓库默认分支名可能不同）
      - name: Verify tag is on main branch
        env:
          TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $tag = "$env:TAG"
          $tagHash = git rev-parse "$tag^{commit}"
          Write-Host "Verifying tag $tag ($tagHash) is on the main branch..."

          $mainBranches = @('main', 'master')
          $found = $false
          foreach ($branch in $mainBranches) {
            $remoteRef = "origin/$branch"
            try {
              git fetch origin $branch 2>$null
              $branchHash = git rev-parse $remoteRef 2>$null
              if (-not $branchHash) {
                Write-Host "::notice::$remoteRef not found, skipping"
                continue
              }
              # merge-base --is-ancestor 通过退出码返回结果
              git merge-base --is-ancestor $tagHash $branchHash
              if ($LASTEXITCODE -eq 0) {
                Write-Host "::notice::Tag $tag is reachable from $remoteRef ($branchHash)"
                $found = $true
                break
              } else {
                Write-Host "Tag $tag is NOT an ancestor of $remoteRef"
              }
            } catch {
              Write-Host "::warning::Error checking $remoteRef : $_"
            }
          }
          if (-not $found) {
            throw "Tag $tag 不在 main/master 分支历史中，仅允许从主分支发布新版本"
          }

      # ── 3. 设置 JDK 17（启用 Gradle 缓存） ──────────────────
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      # ── 4. 校验版本号一致性 ──────────────────────────────────
      # 检查点：
      #   - tag (vX.Y.Z) == "v" + build.gradle version
      #   - UiConstants.VERSION 不再硬编码（应从 version.properties 加载）
      # 用 bash 避免 PowerShell 在 CI 上的反引号/编码边界问题
      - name: Verify version consistency
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          tag="$TAG"
          echo "TAG=$tag"

          # 1) build.gradle version
          if [ ! -f build.gradle ]; then
            echo "::error::build.gradle not found at $(pwd)/build.gradle"
            ls -la
            exit 1
          fi
          gradle_version=$(grep -E "^[[:space:]]*version[[:space:]]*=[[:space:]]*'[^']+'" build.gradle | head -1 | sed -E "s/.*'([^']+)'.*/\1/")
          if [ -z "$gradle_version" ]; then
            echo "::error::Cannot find version line in build.gradle"
            head -30 build.gradle
            exit 1
          fi
          echo "build.gradle version = $gradle_version"

          # 2) UiConstants.VERSION must load dynamically from version.properties
          ui_file="src/main/java/com/datasync/ui/UiConstants.java"
          if [ ! -f "$ui_file" ]; then
            echo "::error::$ui_file not found"
            exit 1
          fi
          if ! grep -qE 'VERSION[[:space:]]*=[[:space:]]*"v"[[:space:]]*\+[[:space:]]*loadVersion[[:space:]]*\(' "$ui_file"; then
            echo "::error::UiConstants.VERSION is not dynamic; should be loadVersion()-based"
            head -20 "$ui_file"
            exit 1
          fi
          echo "UiConstants.VERSION loads dynamically"

          # 3) tag must equal v$gradle_version
          expected_tag="v$gradle_version"
          if [ "$tag" != "$expected_tag" ]; then
            echo "::error::Tag mismatch: tag=$tag expected=$expected_tag"
            exit 1
          fi

          echo "::notice::Version consistency check PASSED: $tag == v$gradle_version"

      # ── 5. 构建 EXE 和分发 ZIP ───────────────────────────────
      - name: Build exe & package zip
        shell: cmd
        run: gradlew.bat createExe packageZip --no-daemon --console=plain

      # ── 6. 备份构建产物（失败排查 + 二次发布用） ──────────────
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ github.ref_name }}
          path: |
            build/launch4j/DataSync.exe
            build/launch4j/DataSync.exe.sha256
            build/distributions/DataSync-*-win-x64.zip
            release_notes.md
          if-no-files-found: warn
          retention-days: 14

      # ── 7. 生成 EXE 的 SHA-256 校验文件 ──────────────────────
      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $exe = "build/launch4j/DataSync.exe"
          if (-not (Test-Path $exe)) {
            throw "EXE not found: $exe (build may have failed)"
          }
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          "$hash  DataSync.exe" | Out-File -Encoding ascii build/launch4j/DataSync.exe.sha256
          Write-Host "::notice::SHA-256 = $hash"
          Get-Content build/launch4j/DataSync.exe.sha256

      # ── 8. 从 CHANGELOG.md 提取本版本日志作为 Release 描述 ────
      # 使用严格正则避免 v1.1.1 误匹配 v1.1.10
      - name: Extract changelog for this version
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          tag="$TAG"
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md not found"
            exit 1
          fi
          # Find the section for this tag: from "## [vX.Y.Z]" to next "## " or EOF
          start_line=$(grep -nE "^##[[:space:]]+\[[[:space:]]*$tag[[:space:]]*\]" CHANGELOG.md | head -1 | cut -d: -f1)
          if [ -z "$start_line" ]; then
            echo "::error::No '## [$tag]' section in CHANGELOG.md"
            exit 1
          fi
          next_line=$(tail -n +$((start_line + 1)) CHANGELOG.md | grep -nE "^##[[:space:]]" | head -1 | cut -d: -f1)
          if [ -z "$next_line" ]; then
            total=$(wc -l < CHANGELOG.md)
            end_line=$total
          else
            end_line=$((start_line + next_line - 1))
          fi
          sed -n "${start_line},${end_line}p" CHANGELOG.md > release_notes.md
          echo "----- release_notes.md -----"
          cat release_notes.md

      # ── 9. 创建 GitHub Release ───────────────────────────────
      # 需要前面所有步骤成功：构建产物存在 + release_notes.md 已生成
      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            build/launch4j/DataSync.exe
            build/launch4j/DataSync.exe.sha256
            build/distributions/DataSync-*-win-x64.zip
          fail_on_unmatched_files: true
          generate_release_notes: false
