name: Release

# 推送 v* 格式的 Tag 时自动构建并发布新版本到 GitHub Releases
# 仅 main（或 master）分支上的 Tag 生效
on:
  push:
    tags:
      - 'v*'

# 防止同一 tag 多次并发执行（如 force-push 同一 tag）
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest
    # 显式超时：30 分钟包含 clean build + 上传；超出立即 fail
    timeout-minutes: 30

    steps:
      # ── 1. 拉取完整历史（含 tags） ─────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # ── 2. 校验 tag 必须位于主分支历史中 ────────────────────
      # 兼容 main 或 master（不同仓库默认分支名可能不同）
      - name: Verify tag is on main branch
        env:
          TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $tag = "$env:TAG"
          $tagHash = git rev-parse "$tag^{commit}"
          Write-Host "Verifying tag $tag ($tagHash) is on the main branch..."

          $mainBranches = @('main', 'master')
          $found = $false
          foreach ($branch in $mainBranches) {
            $remoteRef = "origin/$branch"
            try {
              git fetch origin $branch 2>$null
              $branchHash = git rev-parse $remoteRef 2>$null
              if (-not $branchHash) {
                Write-Host "::notice::$remoteRef not found, skipping"
                continue
              }
              # merge-base --is-ancestor 通过退出码返回结果
              git merge-base --is-ancestor $tagHash $branchHash
              if ($LASTEXITCODE -eq 0) {
                Write-Host "::notice::Tag $tag is reachable from $remoteRef ($branchHash)"
                $found = $true
                break
              } else {
                Write-Host "Tag $tag is NOT an ancestor of $remoteRef"
              }
            } catch {
              Write-Host "::warning::Error checking $remoteRef : $_"
            }
          }
          if (-not $found) {
            throw "Tag $tag 不在 main/master 分支历史中，仅允许从主分支发布新版本"
          }

      # ── 3. 设置 JDK 17（启用 Gradle 缓存） ──────────────────
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Verify version consistency
        env:
          TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          # 统一异常处理：把详细诊断写入 GITHUB_STEP_SUMMARY（公开可见，无需登录）
          $summaryFile = "$env:GITHUB_STEP_SUMMARY"
          $diag = New-Object System.Collections.Generic.List[string]

          try {
            $tag = "$env:TAG"
            $headSha = git rev-parse HEAD
            $headShort = $headSha.Substring(0, 8)
            $bgExists = Test-Path build.gradle
            $uiExists = Test-Path "src/main/java/com/datasync/ui/UiConstants.java"
            Write-Host "::notice::TAG=$tag, HEAD=$headShort, PWD=$PWD"
            Write-Host "::notice::build.gradle exists: $bgExists, UiConstants.java exists: $uiExists"
            $diag.Add("TAG=$tag, HEAD=$headShort, PWD=$PWD")
            $diag.Add("build.gradle exists: $bgExists, UiConstants.java exists: $uiExists")

            if (-not $bgExists) { throw "build.gradle not found: $PWD/build.gradle" }
            if (-not $uiExists) { throw "UiConstants.java not found" }

            # 1) build.gradle version
            $gradleContent = Get-Content build.gradle -Raw
            $gradleMatch = [regex]::Match(
              $gradleContent,
              "^\s*version\s*=\s*'([^']+)'",
              [System.Text.RegularExpressions.RegexOptions]::Multiline
            )
            if (-not $gradleMatch.Success) {
              Write-Host "::error::build.gradle missing top-level `version = 'X.Y.Z'` line. First 30 lines:"
              $gradleContent -split "`n" | Select-Object -First 30 | ForEach-Object { Write-Host "::error::  $_" }
              throw "build.gradle missing top-level version line"
            }
            $gradleVersion = $gradleMatch.Groups[1].Value
            Write-Host "::notice::build.gradle version = $gradleVersion"
            $diag.Add("build.gradle version: $gradleVersion")

            # 2) UiConstants.VERSION must be dynamic
            $uiPath = "src/main/java/com/datasync/ui/UiConstants.java"
            $uiSrc = Get-Content $uiPath -Raw
            $expectedPattern = 'VERSION\s*=\s*"v"\s*\+\s*loadVersion\s*\('
            if ($uiSrc -notmatch $expectedPattern) {
              Write-Host "::error::$uiPath VERSION field wrong. First 20 lines:"
              $uiSrc -split "`n" | Select-Object -First 20 | ForEach-Object { Write-Host "::error::  $_" }
              throw "$uiPath VERSION field should be `"v`" + loadVersion()` form"
            }
            Write-Host "::notice::UiConstants.VERSION loads dynamically from version.properties"
            $diag.Add("UiConstants.VERSION: dynamic load (OK)")

            # 3) tag == v$gradleVersion
            $expectedTag = "v$gradleVersion"
            if ($tag -ne $expectedTag) {
              throw "Tag and build.gradle version mismatch: tag=$tag, build.gradle=$gradleVersion (expected tag=$expectedTag)"
            }

            Write-Host "::notice::Version consistency check passed (tag=$tag == v$gradleVersion)"
            $diag.Add("Version consistency check PASSED: $tag == v$gradleVersion")

            # Write to step summary
            if ($summaryFile) {
              "## Version Check: PASSED" | Out-File -FilePath $summaryFile -Append -Encoding utf8
              ($diag | ForEach-Object { "- $_" }) | Out-File -FilePath $summaryFile -Append -Encoding utf8
            }
          } catch {
            $errMsg = $_.Exception.Message
            Write-Host "::error::FAILED: $errMsg"
            if ($summaryFile) {
              "## Version Check: FAILED" | Out-File -FilePath $summaryFile -Append -Encoding utf8
              "" | Out-File -FilePath $summaryFile -Append -Encoding utf8
              ($diag | ForEach-Object { "- $_" }) | Out-File -FilePath $summaryFile -Append -Encoding utf8
              "" | Out-File -FilePath $summaryFile -Append -Encoding utf8
              "**Error**: $errMsg" | Out-File -FilePath $summaryFile -Append -Encoding utf8
            }
            throw
          }

      # ── 5. 构建 EXE 和分发 ZIP ───────────────────────────────
      - name: Build exe & package zip
        shell: cmd
        run: gradlew.bat createExe packageZip --no-daemon --console=plain

      # ── 6. 备份构建产物（失败排查 + 二次发布用） ──────────────
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ github.ref_name }}
          path: |
            build/launch4j/DataSync.exe
            build/launch4j/DataSync.exe.sha256
            build/distributions/DataSync-*-win-x64.zip
            release_notes.md
          if-no-files-found: warn
          retention-days: 14

      # ── 7. 生成 EXE 的 SHA-256 校验文件 ──────────────────────
      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $exe = "build/launch4j/DataSync.exe"
          if (-not (Test-Path $exe)) {
            throw "EXE 不存在：$exe（构建可能失败）"
          }
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          "$hash  DataSync.exe" | Out-File -Encoding ascii build/launch4j/DataSync.exe.sha256
          Write-Host "::notice::SHA-256 = $hash"
          Get-Content build/launch4j/DataSync.exe.sha256

      # ── 8. 从 CHANGELOG.md 提取本版本日志作为 Release 描述 ────
      # 使用严格正则 `^##\s+\[v1.1.1\]` 避免 v1.1.1 误匹配 v1.1.10
      - name: Extract changelog for this version
        env:
          TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $tag = "$env:TAG"
          $changelog = "CHANGELOG.md"
          if (-not (Test-Path $changelog)) {
            throw "未找到 $changelog"
          }
          $lines = Get-Content $changelog
          $start = -1
          $end = $lines.Count
          $tagPattern = "^\s*##\s+\[\s*$([regex]::Escape($tag))\s*\]"

          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^##\s+') {
              if ($start -ge 0) { $end = $i; break }
              if ($lines[$i] -match $tagPattern) { $start = $i }
            }
          }
          if ($start -lt 0) {
            throw "CHANGELOG.md 中未找到 $tag 的 `## [$tag]` 小节，请先补充版本日志"
          }
          if ($end -le $start) { $end = $lines.Count }

          $lines[$start..($end-1)] | Out-File -Encoding utf8 release_notes.md
          Write-Host "::notice::Extracted release notes:"
          Write-Host "----- release_notes.md -----"
          Get-Content release_notes.md

      # ── 9. 创建 GitHub Release ───────────────────────────────
      # 需要前面所有步骤成功：构建产物存在 + release_notes.md 已生成
      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            build/launch4j/DataSync.exe
            build/launch4j/DataSync.exe.sha256
            build/distributions/DataSync-*-win-x64.zip
          fail_on_unmatched_files: true
          generate_release_notes: false
